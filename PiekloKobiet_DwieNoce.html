<style>

<script>
(()=>{'use strict';
/* =====================================================================
   PIEKŁO KOBIET: DWIE NOCE
   Skradanka narracyjna. Jeden plik, bez zewnętrznych zasobów (poza fontem).
   Grafika: Canvas 2D + dynamiczne oświetlenie z cieniami (raycasting).
   Dźwięk: WebAudio — muzyka, ambient i efekty generowane proceduralnie.
   ===================================================================== */
const VW=1152,VH=648,TS=40,W=46,H=30;
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');cv.width=VW;cv.height=VH;
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px'}
addEventListener('resize',fit);fit();
const cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
const angD=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function RNG(s){let a=s>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const FONT="'EB Garamond',Georgia,serif",FH="'Cormorant Garamond',Georgia,serif";

let cfg=Object.assign({master:.8,music:.7,sfx:.85,diff:1,shake:1,touch:'auto'},store.get('pkdn_cfg',{}));
let save=Object.assign({unlocked:0,docs:{},cur:-1,stats:{}},store.get('pkdn_save',{}));
const saveAll=()=>{store.set('pkdn_save',save);store.set('pkdn_cfg',cfg)};
const DIFF=[{n:'Fabularny',spd:.82,vis:.75,hear:.75,rocks:2,res:1.5},{n:'Normalny',spd:1,vis:1,hear:1,rocks:0,res:1},{n:'Trudny',spd:1.1,vis:1.15,hear:1.2,rocks:-1,res:.8}];
const D=()=>DIFF[cfg.diff]||DIFF[1];

/* =====================================================================
   AUDIO
   ===================================================================== */
const AU={c:null};
function ainit(){
 if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const c=AU.c=new AC();
 AU.comp=c.createDynamicsCompressor();AU.comp.threshold.value=-10;AU.comp.knee.value=12;AU.comp.ratio.value=8;AU.comp.attack.value=.004;AU.comp.release.value=.2;AU.comp.connect(c.destination);
 AU.pre=c.createGain();AU.pre.gain.value=3.4;AU.pre.connect(AU.comp);AU.master=c.createGain();AU.master.connect(AU.pre);
 try{const b=c.createBuffer(1,1,22050),sr=c.createBufferSource();sr.buffer=b;sr.connect(c.destination);sr.start(0)}catch(e){}
 AU.mus=c.createGain();AU.sfx=c.createGain();AU.amb=c.createGain();
 [AU.mus,AU.sfx,AU.amb].forEach(g=>g.connect(AU.master));
 const len=c.sampleRate*3,ir=c.createBuffer(2,len,c.sampleRate);
 for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}
 AU.rev=c.createConvolver();AU.rev.buffer=ir;const rg=c.createGain();rg.gain.value=.5;AU.rev.connect(rg);rg.connect(AU.master);
 const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.noise=nb;
 applyVol();setInterval(musSched,40);
 if(AU.wantAmb)setAmb(AU.wantAmb);
}
function applyVol(){if(!AU.c)return;const t=AU.c.currentTime;AU.master.gain.setTargetAtTime(cfg.master,t,.05);AU.mus.gain.setTargetAtTime(cfg.music*.9,t,.05);AU.sfx.gain.setTargetAtTime(cfg.sfx,t,.05);AU.amb.gain.setTargetAtTime(cfg.sfx*1.2,t,.05)}
function route(g,dest,pan,rev){const c=AU.c;let n=dest||AU.sfx;
 if(pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=cl(pan,-1,1);p.connect(n);n=p}
 g.connect(n);if(rev){const r=c.createGain();r.gain.value=rev;g.connect(r);r.connect(AU.rev)}}
function tone(o){const c=AU.c;if(!c)return;const{f=440,type='sine',t=0,at=null,a=.005,d=.3,v=.3,f2=null,dest,pan=0,rev=0,lp=0,q=1,det=0}=o;
 const t0=at!=null?at:c.currentTime+t;const os=c.createOscillator();os.type=type;os.frequency.setValueAtTime(f,t0);if(det)os.detune.value=det;
 if(f2)os.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t0+a+d);
 const g=c.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+d);
 let n=os;if(lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;fl.Q.value=q;os.connect(fl);n=fl}
 n.connect(g);route(g,dest,pan,rev);os.start(t0);os.stop(t0+a+d+.05)}
function nz(o){const c=AU.c;if(!c)return;const{t=0,at=null,a=.003,d=.15,v=.3,type='bandpass',f=1000,f2=null,q=1,dest,pan=0,rev=0}=o;
 const t0=at!=null?at:c.currentTime+t;const s=c.createBufferSource();s.buffer=AU.noise;
 const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+a+d);fl.Q.value=q;
 const g=c.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+d);
 s.connect(fl);fl.connect(g);route(g,dest,pan,rev);s.start(t0,Math.random());s.stop(t0+a+d+.05)}
const SURF={wood:[750,1.1,1.15],carpet:[320,.45,.5],stone:[1700,1,1.25],tile:[2400,.85,1.1],concrete:[1300,.8,1]};
const SFX={
 step(s,v=1,pan=0){const m=SURF[s]||SURF.wood;nz({f:m[0]*(.85+Math.random()*.3),q:.9,d:.09,v:.6*v*Math.max(.6,m[1]),pan,rev:.08});nz({f:m[0]*.45,type:'lowpass',d:.07,v:.45*v*Math.max(.6,m[1]),pan});tone({f:85+Math.random()*30,d:.08,v:.3*v*m[1],pan})},
 creak(v=1,pan=0){tone({f:300+Math.random()*80,f2:170,type:'sawtooth',a:.04,d:.35,v:.035*v,lp:1100,q:8,pan,rev:.25})},
 door(open,v=1,pan=0){tone({f:open?340:260,f2:open?170:120,type:'sawtooth',a:.05,d:.5,v:.045*v,lp:800,q:7,pan,rev:.3});nz({t:open?.38:.15,f:260,type:'lowpass',d:.14,v:.45*v,pan,rev:.3})},
 pick(){[784,1175,1568].forEach((f,i)=>tone({f,t:i*.08,d:.7,v:.07,type:'triangle',rev:.6}))},
 key(){[1568,2093,2637,3136].forEach((f,i)=>tone({f,t:i*.05,d:.4,v:.04,type:'sine',rev:.6}))},
 page(){nz({f:3800,q:.6,d:.16,v:.18});nz({t:.11,f:2900,q:.6,d:.22,v:.14})},
 ward(){tone({f:160,f2:90,type:'sawtooth',a:.02,d:.3,v:.05,lp:500,q:5});nz({t:.24,f:180,type:'lowpass',d:.16,v:.5})},
 throw(){nz({f:1400,f2:400,d:.18,v:.12,q:.6})},
 land(v=1,pan=0){[0,.09,.17].forEach((t,i)=>nz({t,f:2600+i*300,d:.05,v:(.4-i*.12)*v,q:2.5,pan,rev:.35}))},
 huh(p=1,pan=0){tone({f:120*p,f2:175*p,type:'sawtooth',a:.04,d:.32,v:.07,lp:950,q:5,pan,rev:.2});tone({f:240*p,f2:330*p,type:'triangle',a:.04,d:.3,v:.03,pan})},
 alert(){[0,1,6,11].forEach(s=>tone({f:196*Math.pow(2,s/12),type:'sawtooth',a:.01,d:1.3,v:.035,lp:2200,rev:.7}));nz({f:120,type:'lowpass',d:.6,v:.6});tone({f:70,f2:35,d:.6,v:.5})},
 caught(){tone({f:65,f2:28,d:1.8,v:.7});[0,1,3,6,7].forEach(s=>tone({f:415*Math.pow(2,s/12),type:'sawtooth',a:.01,d:2,v:.03,lp:3200,rev:.9}));nz({f:900,f2:90,d:1.4,v:.5,type:'lowpass'})},
 heart(v){tone({f:58,d:.13,v:.55*v});tone({t:.2,f:52,d:.15,v:.42*v})},
 blip(era){if(era===1899)nz({f:5200,q:3,d:.02,v:.04});else tone({f:1000+Math.random()*250,type:'square',d:.022,v:.01,lp:2600})},
 buzz(v=.6){for(let i=0;i<3;i++)tone({t:i*.13,f:140,type:'square',d:.09,v:.05*v,lp:380})},
 ring(){for(let r=0;r<2;r++)[1319,1568,1760,1568,1319,1047].forEach((f,i)=>tone({t:r*.9+i*.12,f,type:'square',d:.1,v:.05,lp:4200,rev:.3}))},
 thunder(){nz({f:240,type:'lowpass',a:.03,d:2.4,v:.9,rev:.6});nz({t:.15,f:80,type:'lowpass',a:.4,d:3.2,v:.8})},
 scare(){const c=AU.c;if(!c)return;
  [0,1,3,6,10].forEach((s,i)=>{tone({f:660*Math.pow(2,s/12),f2:1400*Math.pow(2,s/12),type:'sawtooth',a:.01,d:1.5,v:.16,lp:5200,q:2,det:i*7})});
  tone({f:1900,f2:2600,type:'square',a:.01,d:1.1,v:.05});
  nz({f:1800,f2:600,type:'bandpass',a:.005,d:1.4,v:1,q:.6});nz({f:4000,type:'highpass',a:.003,d:.5,v:.9});
  tone({f:48,f2:26,type:'sine',a:.005,d:2.2,v:1});tone({t:.02,f:90,f2:40,type:'sawtooth',a:.005,d:.9,v:.4,lp:300});
  nz({t:.15,f:300,type:'lowpass',a:.01,d:1.6,v:.8,rev:.5})},
 clock(){[0,1].forEach(i=>{tone({f:392,t:i*1.4,type:'sine',a:.01,d:2.8,v:.12,rev:.9});tone({f:784*1.005,t:i*1.4,type:'sine',a:.01,d:1.6,v:.05,rev:.9})})},
 far(pan=0){tone({f:140+Math.random()*60,f2:90,type:'sawtooth',a:.1,d:.7,v:.03,lp:500,q:4,pan,rev:.8});nz({t:.2,f:300,type:'lowpass',d:.3,v:.2,pan,rev:.8})},
 scratch(pan=0){for(let i=0;i<5;i++)nz({t:i*.07,f:3800+Math.random()*1500,q:5,d:.03,v:.12,pan})},
 ding(pan=0){tone({f:1318,type:'sine',d:1.2,v:.07,pan,rev:.8});tone({t:.4,f:1046,type:'sine',d:1.4,v:.06,pan,rev:.8})},
 siren(pan=0){tone({f:700,f2:520,t:0,type:'sine',a:.4,d:1.6,v:.025,pan,rev:.7});tone({f:520,f2:700,t:1.8,type:'sine',a:.4,d:1.6,v:.025,pan,rev:.7})},
 gust(){nz({f:500,f2:900,type:'bandpass',a:1.2,d:2.2,v:.35,q:.7,dest:AU.amb})},
 ui(){tone({f:620,type:'triangle',d:.09,v:.05})},
 uiOk(){tone({f:660,type:'triangle',d:.12,v:.05});tone({t:.07,f:990,type:'triangle',d:.15,v:.04})},
 beep(){tone({f:1900,type:'square',d:.07,v:.03});tone({t:.13,f:1900,type:'square',d:.07,v:.03})},
 camAlarm(){for(let i=0;i<4;i++)tone({t:i*.2,f:i%2?1100:1500,type:'square',d:.16,v:.035,lp:3000})},
 shutter(){nz({f:4200,d:.035,v:.25,q:1.5});nz({t:.07,f:3000,d:.05,v:.2,q:1.5})},
 tick(){nz({f:4200,q:6,d:.015,v:.05,dest:AU.amb})},
 light(on,era){if(era===1899){nz({f:2600,f2:500,d:.35,v:.22});if(on)nz({t:.2,f:600,type:'lowpass',d:.6,v:.12})}else tone({f:on?2400:1800,type:'square',d:.02,v:.03})},
 win(){[523,659,784,1047,1319].forEach((f,i)=>tone({f,t:i*.13,d:1.6,v:.06,type:'triangle',rev:.7}))},
 sting(){[0,4,7].forEach((s,i)=>tone({f:220*Math.pow(2,s/12),t:i*.02,type:'triangle',d:2.2,v:.05,rev:.8}))}
};
/* ----- ambient ----- */

 <tr><td>F</td><td>Rzuć guzik/monetę w stronę kursora — hałas odciąga strażników</td></tr><tr><td>Q</td><td>Świeca / latarka. Daje światło, ale zdradza ciebie.</td></tr>
 <tr><td>X</td><td>Wycisz powiadomienie, zanim telefon zadzwoni</td></tr><tr><td>M</td><td>Plan domu (tylko odkryte miejsca)</td></tr><tr><td>Esc</td><td>Pauza</td></tr><tr><td>Mysz</td><td>Patrzenie i celowanie</td></tr></table>
 <h3>Wskazówki</h3><p>• Oko w lewym dolnym rogu pokazuje, jak bardzo jesteś widoczna. Ciemność, skradanie i bezruch pomagają.<br>• Pierścień nad strażnikiem to jego podejrzenia. Gdy się wypełni — pościg.<br>• Dywany tłumią kroki. Niektóre deski skrzypią — mają widoczne pęknięcia.<br>• Zamykaj drzwi za sobą. Strażnik traci czas na ich otwieranie.<br>• Nie chowaj się w szafie na oczach strażnika. Ulubione kryjówki też zaczną sprawdzać.<br>• Złapana zaczynasz od nowa, ale zebrane przedmioty zostają.</p>`;
function journalHTML(){let h='<h2>Archiwum dokumentów</h2><div class="jl">';CH.forEach((c,ci)=>{h+=`<h3>${c.num}: ${c.title} <small>(${c.era})</small></h3>`;c.docs.forEach((d,di)=>{h+=save.docs[ci+'_'+di]?`<div class="it"><b>${d.t}</b> <small>${d.h?'· fakt historyczny':'· fikcja'}</small><br>${d.b}</div>`:`<div class="it"><small>— nieodnaleziony —</small></div>`})});return h+'</div>'}
const ABOUT=`<h2>O grze</h2><p>Kraków, kamienica przy ulicy Szpitalnej. W 1899 roku dziewiętnastoletnia Jadwiga walczy o prawo do nauki pod okiem wuja-opiekuna. W 2026 roku jej praprawnuczka Zuzanna, reporterka, walczy o prawo do mówienia o tym, co spotkało jej koleżankę.</p>
 <p>Dwie noce, ten sam dom, dwa feminizmy: emancypacja czasów Młodej Polski — o edukację, majątek i głos w prawie — oraz współczesny spór o przemoc, wiarygodność, ciało i to, kogo feminizm właściwie reprezentuje.</p>
 <p>Gra pokazuje też głosy krytyczne wobec obu ruchów — bo tak wyglądała i wygląda rzeczywistość.</p>`;
function pauseMenu(){G.state='pause';setMusicPause(true);show('panel',`<h2>Pauza</h2><div style="text-align:center"><div><button id="pR">Wznów</button></div><div><button id="pS">Ustawienia</button></div><div><button id="pJ">Archiwum</button></div><div><button id="pH">Jak grać</button></div><div><button id="pRe">Zacznij noc od nowa</button></div><div><button id="pM">Wyjdź do menu</button></div></div>`);
 $('#pR').onclick=resume;$('#pS').onclick=()=>{panel(settingsHTML(),pauseMenu);bindSettings()};$('#pJ').onclick=()=>panel(journalHTML(),pauseMenu);$('#pH').onclick=()=>panel(HOW,pauseMenu);
 $('#pRe').onclick=()=>{hide('panel');startChapter(G.ci)};$('#pM').onclick=()=>{toMenu()}}
function resume(){hide('panel');G.state='play';setMusicPause(false)}
function setMusicPause(p){if(!AU.c)return;AU.mus.gain.setTargetAtTime(p?cfg.music*.2:cfg.music*.9,AU.c.currentTime,.2)}
function retryOverlay(){G.state='caughtMenu';const e=G.catcher;
 show('panel',`<h2 style="color:#d8413f;letter-spacing:.2em;text-align:center">ZŁAPANA</h2><p style="text-align:center;font-style:italic">„${e.l.caught}” — ${e.name}</p><p style="text-align:center;color:var(--dim)">Zebrane przedmioty zostają przy tobie.</p><div style="text-align:center"><button id="rT">Spróbuj ponownie</button><button id="rM">Menu</button></div>`);
 $('#rT').onclick=()=>{SFX.ui();hide('panel');resetPositions();G.state='play'};$('#rM').onclick=()=>toMenu()}

// przyciski menu
$('#bNew').onclick=()=>{SFX.uiOk();save.docs=save.docs||{};startChapter(0)};
$('#bCont').onclick=()=>{SFX.uiOk();startChapter(cl(save.cur>=0?save.cur:save.unlocked,0,CH.length-1))};
$('#bChap').onclick=()=>{SFX.ui();panel('<h2>Rozdziały</h2><div style="text-align:center">'+CH.map((c,i)=>`<div><button data-ch="${i}" ${i>save.unlocked?'disabled':''} style="min-width:min(440px,80vw)">${c.num}: ${c.title} · ${c.era}</button></div>`).join('')+'</div>');$('#pbox').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{SFX.uiOk();startChapter(+b.dataset.ch)})};
$('#bJour').onclick=()=>{SFX.ui();panel(journalHTML())};
$('#bHow').onclick=()=>{SFX.ui();panel(HOW)};
$('#bSet').onclick=()=>{SFX.ui();panel(settingsHTML());bindSettings()};
$('#bAbout').onclick=()=>{SFX.ui();panel(ABOUT)};
dlg.addEventListener('pointerdown',e=>{e.stopPropagation();ainit();advance()});
$('#doc').addEventListener('pointerdown',()=>closeDoc());

/* ----- wejście ----- */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();ainit();if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();if(e.repeat&&k!=='e'){G.keys[k]=1;return}G.keys[k]=1;onKey(k)});
addEventListener('keyup',e=>{G.keys[e.key.toLowerCase()]=0});
addEventListener('blur',()=>{G.keys={}});
function onKey(k){
 if(G.state==='dialog'){if(k===' '||k==='enter'||k==='e')advance();return}
 if(G.state==='card'){if(k===' '||k==='enter'||k==='escape')G.cardT=Math.max(G.cardT,3.6);return}
 if(G.state==='doc'){if(k===' '||k==='e'||k==='escape'||k==='enter')closeDoc();return}
 if(G.state==='pause'){if(k==='escape')resume();return}
 if(G.state!=='play')return;
 if(k==='escape'){pauseMenu();return}
 if(k==='e')interact();if(k==='f')throwRock();if(k==='c'||k==='control')P.crouch=!P.crouch;
 if(k==='q'&&!P.hidden){if(P.res<=0){toast(L.era===1899?'Nie masz już świecy':'Bateria rozładowana','#e0a080');return}P.light=!P.light;SFX.light(P.light,L.era)}
 if(k==='m'||k==='tab')G.showMap=!G.showMap;
 if(k==='x'&&L.notif){L.notif=null;L.notifT=14+Math.random()*12;SFX.buzz(.25);toast('Wyciszone','#9fb7e0',1.2)}}
const toCanvas=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH}};
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const p=toCanvas(e);G.mouse.x=p.x;G.mouse.y=p.y;G.mouse.t=G.t});
cv.addEventListener('pointerdown',e=>{ainit();if(G.state==='card'){G.cardT=Math.max(G.cardT,3.6);return}if(G.state==='play'&&e.pointerType==='mouse'){const p=toCanvas(e);G.mouse.x=p.x;G.mouse.y=p.y;G.mouse.t=G.t;if(e.button===0)throwRock()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// dotyk
const joy=$('#joy'),knob=$('#knob');let jid=null;
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jmove(e);ainit()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
['pointerup','pointercancel'].forEach(ev=>joy.addEventListener(ev,e=>{if(e.pointerId!==jid)return;jid=null;G.joy=null;knob.style.left='40px';knob.style.top='40px'}));
function jmove(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}G.joy={x,y};knob.style.left=40+x*40+'px';knob.style.top=40+y*40+'px'}
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();ainit();G.keys[k]=1;if(G.state==='dialog'){advance();return}onKey(k)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{G.keys[k]=0}))});
function updTouch(){const on=cfg.touch==='on'||(cfg.touch==='auto'&&matchMedia('(pointer:coarse)').matches);$('#touch').classList.toggle('on',on)}updTouch();

/* ----- pętla ----- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 try{
 if(G.state==='menu'){drawMenuBg(now/1000)}
 else if(G.state==='card'){G.cardT+=dt;drawCard();if(G.cardT>4.4)beginPlay()}
 else if(L&&P){if(G.state==='play')update(dt);
  if(G.state==='caught'){G.ct+=dt;L.enemies.forEach(e=>{e.sayT=(e.sayT||0)-dt*.2});if(G.ct>2.6)retryOverlay()}
  if(['play','caught','caughtMenu','dialog','pause','doc','choice','ending'].includes(G.state))render();
  if(G.state==='dialog'||G.state==='choice'||G.state==='ending'){ctx.fillStyle=G.state==='dialog'?'rgba(0,0,0,.35)':'rgba(0,0,0,.85)';ctx.fillRect(0,0,VW,VH)}}
 else drawMenuBg(now/1000);
 twTick(dt);
 if(!(G.sndT>0))G.sndT=0;G.sndT-=dt;if(G.sndT<=0){G.sndT=.4;const bad=!AU.c||AU.c.state!=='running';$('#snd').style.display=bad?'block':'none'}
 }catch(err){console.error(err)}
 requestAnimationFrame(loop)}
toMenu();requestAnimationFrame(loop);
['pointerup','click','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>ainit(),true));$('#snd').addEventListener('click',()=>ainit());
document.addEventListener('pointerdown',()=>{ainit();if(G.state==='menu'&&!MUS.started){MUS.started=1;setMusic(null);setMusic('menu')}},{once:false});
window.__G=G;window.__dbg={AU,MUS,SFX,get L(){return L},get P(){return P},startChapter,CH,sprite,SPK,EK,spkStyle};
})();
</script>
</body></html>
